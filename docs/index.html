<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0A0E14">
    <title>JARVIS — Mahedi Muktadir</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

        :root {
            --bg-primary: #0A0E14;
            --bg-secondary: #0F1419;
            --bg-card: #151A22;
            --border: #232A34;
            --text-primary: #DDE4ED;
            --text-secondary: #8899AA;
            --text-muted: #4A5568;
            --accent-green: #00E676;
            --accent-blue: #448AFF;
            --accent-orange: #FF9100;
            --accent-purple: #B388FF;
            --accent-cyan: #40C4FF;
            --accent-pink: #FF80AB;
            --radius: 4px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding-bottom: calc(56px + var(--safe-bottom));
            max-width: 375px;
            margin: 0 auto;
        }

        .topbar {
            position: sticky; top: 0; z-index: 100;
            height: 48px; background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px;
        }
        .top-left h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.1; }
        .top-left .sub { font-size: 7px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .top-right { display: flex; align-items: center; gap: 6px; font-size: 8px; }
        .top-right .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--accent-green); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
        .top-right .node { color: var(--text-muted); }

        .agent-scroll {
            display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
            gap: 6px; padding: 8px 12px;
            background: var(--bg-secondary); border-bottom: 1px solid var(--border);
            scrollbar-width: none;
        }
        .agent-scroll::-webkit-scrollbar { display: none; }
        .agent-card {
            flex-shrink: 0; width: 130px; scroll-snap-align: start;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 8px 10px;
            display: flex; flex-direction: column; gap: 4px;
        }
        .agent-card .ac-top { display: flex; align-items: center; gap: 5px; }
        .agent-card .ac-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
        .d-planning { background: var(--accent-blue); animation: pulse 1.8s infinite; }
        .d-running { background: var(--accent-green); animation: pulse 1s infinite; }
        .d-analyzing { background: var(--accent-orange); animation: pulse 1.2s infinite; }
        .d-idle { background: var(--text-muted); }
        .d-measuring { background: var(--accent-cyan); animation: pulse 2s infinite; }
        .agent-card .ac-name { font-size: 8px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
        .agent-card .ac-status { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
        .agent-card .ac-action { font-size: 7px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .tabs {
            display: flex; overflow-x: auto; scrollbar-width: none;
            background: var(--bg-primary); border-bottom: 1px solid var(--border);
            position: sticky; top: 48px; z-index: 50;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            flex: none; padding: 8px 11px;
            font-family: 'JetBrains Mono', monospace; font-size: 8px;
            text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-muted); background: transparent; border: none;
            border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
        }
        .tab.on { color: var(--text-primary); border-bottom-color: var(--accent-blue); }

        .feed { max-height: 55vh; overflow-y: auto; }
        .feed-item {
            display: flex; gap: 7px; padding: 7px 12px;
            border-bottom: 1px solid var(--border); font-size: 9px; align-items: flex-start;
        }
        .feed-tm { color: var(--text-muted); font-size: 7px; min-width: 46px; white-space: nowrap; }
        .feed-tag {
            font-size: 7px; font-weight: 700; text-transform: uppercase;
            padding: 1px 4px; border-radius: 2px; white-space: nowrap; letter-spacing: 0.2px;
        }
        .tg-s { background: #1a2a3a; color: var(--accent-blue); }
        .tg-e { background: #1a2a1a; color: var(--accent-green); }
        .tg-m { background: #2a1a0a; color: var(--accent-orange); }
        .tg-i { background: #1a0a2a; color: var(--accent-purple); }
        .tg-a { background: #0a1a2a; color: var(--accent-cyan); }
        .tg-r { background: #2a0a1a; color: var(--accent-pink); }
        .feed-msg { color: var(--text-secondary); flex: 1; }
        .feed-more { text-align: center; padding: 10px; font-size: 7px; color: var(--text-muted); opacity: 0.5; font-style: italic; }

        .panels { background: var(--border); }
        .panel {
            background: var(--bg-primary); padding: 10px 12px;
            border-bottom: 1px solid var(--border);
        }
        .panel h3 {
            font-size: 8px; text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--text-secondary); margin-bottom: 6px; font-weight: 700;
        }
        .panel .empty { font-size: 8px; color: var(--text-muted); opacity: 0.7; }
        .stat-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 8px; }
        .stat-l { color: var(--text-muted); }
        .stat-v { color: var(--text-secondary); }

        .cmd-bar {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 375px;
            background: var(--bg-secondary); border-top: 1px solid var(--border);
            padding: 8px 12px; padding-bottom: max(8px, var(--safe-bottom));
            z-index: 100;
        }
        .cmd-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        .cmd-wrap {
            flex: 1; display: flex; align-items: center;
            background: var(--bg-primary); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 0 8px; height: 32px;
        }
        .cmd-pfx { color: var(--accent-blue); font-weight: 700; font-size: 11px; margin-right: 6px; }
        .cmd-wrap input {
            flex: 1; background: transparent; border: none; outline: none;
            color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 9px;
        }
        .cmd-wrap input::placeholder { color: var(--text-muted); opacity: 0.5; }
        .cmd-btn {
            background: var(--accent-blue); color: #FFF; border: none;
            border-radius: var(--radius); padding: 6px 14px;
            font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; white-space: nowrap;
            transition: opacity 0.2s;
        }
        .cmd-btn:active { opacity: 0.8; transform: scale(0.96); }
        .cmd-btn.loading { opacity: 0.5; pointer-events: none; }
        .chips { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            flex: none; padding: 4px 8px; border: 1px solid var(--border);
            border-radius: var(--radius); font-family: 'JetBrains Mono', monospace;
            font-size: 7px; color: var(--text-muted); cursor: pointer; white-space: nowrap;
            background: var(--bg-primary); transition: border-color 0.15s;
        }
        .chip:active { border-color: var(--accent-blue); color: var(--text-primary); }

        .toast {
            position: fixed; top: 54px; left: 50%; transform: translateX(-50%);
            background: var(--bg-card); border: 1px solid var(--accent-green);
            border-radius: var(--radius); padding: 6px 12px;
            font-size: 8px; color: var(--accent-green); z-index: 200;
            animation: toastIn 2s ease forwards; pointer-events: none;
            white-space: nowrap;
        }
        @keyframes toastIn {
            0% { opacity: 0; transform: translateX(-50%) translateY(-8px); }
            10% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="top-left">
        <h1>JARVIS</h1>
        <div class="sub">Mahedi Muktadir</div>
    </div>
    <div class="top-right">
        <div class="dot"></div>
        <span style="color:var(--accent-green)">ACTIVE</span>
        <span class="node">— Sakhipur</span>
    </div>
</header>

<div class="agent-scroll" id="agent-scroll"></div>

<nav class="tabs" id="tabs"></nav>

<div class="feed" id="feed"></div>

<div class="panels">
    <div class="panel"><h3>ACTIVE TASKS</h3><div id="tasks-panel" class="empty">No active tasks</div></div>
    <div class="panel"><h3>KNOWLEDGE GAPS</h3><div id="gaps-panel" class="empty">No gaps identified</div></div>
    <div class="panel"><h3>INNOVATIONS</h3><div id="innovations-panel" class="empty">No innovations generated</div></div>
    <div class="panel" id="metrics-panel"><h3>PERFORMANCE METRICS</h3></div>
    <div class="panel" id="sys-panel"><h3>SYSTEM STATUS</h3></div>
</div>

<div class="cmd-bar">
    <div class="cmd-row">
        <div class="cmd-wrap">
            <span class="cmd-pfx">&gt;</span>
            <input id="cmd" placeholder="Type a command..." onkeypress="if(event.key==='Enter')exec()" autocomplete="off">
        </div>
        <button class="cmd-btn" id="run-btn" onclick="exec()">RUN</button>
    </div>
    <div class="chips">
        <span class="chip" onclick="sc('plan today')">plan today</span>
        <span class="chip" onclick="sc('analyze')">analyze</span>
        <span class="chip" onclick="sc('fix gaps')">fix gaps</span>
        <span class="chip" onclick="sc('run loop')">run loop</span>
    </div>
</div>

<script>
// ===== DATA =====
const agents = [
    {n:'STRATEGIST',s:'PLANNING',a:'Generating plan...',c:'#448AFF',d:'d-planning',l:'#448AFF'},
    {n:'EXECUTOR',s:'RUNNING',a:'TSK-023 (65%)',c:'#00E676',d:'d-running',l:'#00E676'},
    {n:'MENTOR',s:'ANALYZING',a:'Detecting gaps...',c:'#FF9100',d:'d-analyzing',l:'#FF9100'},
    {n:'INNOVATOR',s:'IDLE',a:'Awaiting trigger...',c:'#B388FF',d:'d-idle',l:'#B388FF'},
    {n:'AMPLIFIER',s:'MEASURING',a:'Collecting data...',c:'#40C4FF',d:'d-measuring',l:'#40C4FF'},
    {n:'REFLECTOR',s:'IDLE',a:'Cycle pending...',c:'#FF80AB',d:'d-idle',l:'#FF80AB'},
];

let feedData = [
    {t:'10:33:42',a:'AMPLIFIER',m:'Performance metrics updated successfully.',g:'tg-a',cat:'SYSTEM'},
    {t:'10:33:38',a:'MENTOR',m:'Knowledge gap: "Advanced Ad Copy Techniques".',g:'tg-m',cat:'GAPS'},
    {t:'10:33:34',a:'STRATEGIST',m:'Plan updated: Weekly Growth Plan v2.1.',g:'tg-s',cat:'TASKS'},
    {t:'10:33:29',a:'EXECUTOR',m:'Completed TSK-022: Content Research.',g:'tg-e',cat:'TASKS'},
    {t:'10:33:25',a:'EXECUTOR',m:'Started TSK-023: Facebook Ad Campaign.',g:'tg-e',cat:'TASKS'},
    {t:'10:33:20',a:'INNOVATOR',m:'Idea: AI-Powered Ad Creative Generator.',g:'tg-i',cat:'INNOVATIONS'},
    {t:'10:33:15',a:'MENTOR',m:'Analyzing: Ad Copywriting skill gap.',g:'tg-m',cat:'GAPS'},
    {t:'10:33:10',a:'AMPLIFIER',m:'Data from 12 sources collected.',g:'tg-a',cat:'SYSTEM'},
    {t:'10:33:05',a:'STRATEGIST',m:'Generated 5 tasks from objectives.',g:'tg-s',cat:'TASKS'},
    {t:'10:32:58',a:'SYSTEM',m:'Cognitive loop iteration started.',g:'tg-r',cat:'SYSTEM'},
];

let activeTasks = [];
let knowledgeGaps = [];
let innovations = [];
let runCount = 0;

const tabs=['ALL','TASKS','GAPS','INNOVATIONS','SYSTEM'];
let cur='ALL';

const agentColors = {
    'STRATEGIST': 'var(--accent-green)',
    'EXECUTOR': 'var(--accent-green)',
    'MENTOR': 'var(--accent-orange)',
    'INNOVATOR': 'var(--accent-purple)',
    'AMPLIFIER': 'var(--accent-green)',
    'REFLECTOR': 'var(--accent-pink)',
    'SYSTEM': 'var(--accent-pink)',
    'ORCHESTRATOR': 'var(--accent-cyan)'
};

// ===== RENDER =====
document.getElementById('agent-scroll').innerHTML = agents.map(a=>
    `<div class="agent-card" style="border-left:3px solid ${a.l}">
        <div class="ac-top"><div class="ac-dot ${a.d}"></div><span class="ac-name">${a.n}</span></div>
        <div class="ac-status" style="color:${a.c}">${a.s}</div>
        <div class="ac-action">${a.a}</div>
    </div>`
).join('');

function rTabs(){
    document.getElementById('tabs').innerHTML = tabs.map(t=>
        `<button class="tab${t===cur?' on':''}" onclick="sw('${t}')">${t}</button>`
    ).join('');
}
function sw(t){cur=t;rTabs();rFeed();}
function rFeed(){
    const f = cur==='ALL' ? feedData : feedData.filter(i=> i.cat === cur);
    document.getElementById('feed').innerHTML = (f.length ? f.map(i=>
        `<div class="feed-item" style="border-left:3px solid ${agentColors[i.a]||'var(--accent-pink)'}">
            <span class="feed-tm">${i.t}</span>
            <span class="feed-tag ${i.g}">${i.a}</span>
            <span class="feed-msg">${i.m}</span>
        </div>`
    ).join('') : '<div class="feed-more">No entries</div>') + '<div class="feed-more">Swipe up to load more</div>';
}

function renderMetrics(){
    document.getElementById('metrics-panel').innerHTML = '<h3>PERFORMANCE METRICS</h3>'+
        [{l:'Plan Compliance',v:runCount>0?Math.min(100,85+runCount)+'%':'—%'},
         {l:'Tasks Today',v:activeTasks.length||'—'},
         {l:'Task Success Rate',v:runCount>0?Math.min(100,90+runCount)+'%':'—%'},
         {l:'System Efficiency',v:runCount>0?Math.min(100,88+runCount*2)+'%':'—%'}]
        .map(m=>`<div class="stat-row"><span class="stat-l">${m.l}</span><span class="stat-v">${m.v}</span></div>`).join('');
    document.getElementById('sys-panel').innerHTML = '<h3>SYSTEM STATUS</h3>'+
        [{l:'Overall Health',v:runCount>0?'NOMINAL':'—'},
         {l:'Active Agents',v:'6 / 6'},
         {l:'Queue Length',v:activeTasks.length||'—'},
         {l:'Last Cycle',v:runCount>0?new Date().toLocaleTimeString('en-US',{hour12:false}):'—'}]
        .map(m=>`<div class="stat-row"><span class="stat-l">${m.l}</span><span class="stat-v">${m.v}</span></div>`).join('');
}

function sc(c){ document.getElementById('cmd').value = c; document.getElementById('cmd').focus(); }

// ===== TOAST =====
function showToast(msg, color) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    if(color) t.style.color = color;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2200);
}

// ===== COMMAND EXECUTION =====
function exec(){
    const input = document.getElementById('cmd');
    const btn = document.getElementById('run-btn');
    const c = input.value.trim();
    if(!c) return;

    btn.textContent = '...';
    btn.classList.add('loading');
    input.disabled = true;

    const result = simulateCommand(c);
    runCount++;

    const now = new Date().toLocaleTimeString('en-US', { hour12: false });
    feedData.unshift({
        t: now,
        a: result.agent.toUpperCase(),
        m: result.message,
        g: result.tagClass,
        cat: result.category
    });

    if (cur==='ALL'||cur===result.category) rFeed();
    updatePanels(result);
    renderMetrics();

    showToast('✅ '+result.message, 'var(--accent-green)');

    input.value = '';
    input.disabled = false;
    btn.textContent = 'RUN';
    btn.classList.remove('loading');
    input.focus();
}

function simulateCommand(cmd){
    const c = cmd.toLowerCase().trim();
    let r = {};

    if(c.includes('plan')){
        const taskId = 'TSK-'+String(activeTasks.length+24).padStart(3,'0');
        activeTasks.push({id:taskId,title:cmd,progress:0});
        r = {agent:'strategist',tagClass:'tg-s',category:'TASKS',
             message:`Plan generated: "${cmd}" → ${taskId}`};
    }else if(c.includes('loop')||c.includes('cycle')){
        r = {agent:'orchestrator',tagClass:'tg-a',category:'SYSTEM',
             message:'Cognitive loop: Perceive→Reason→Act→Reflect completed'};
    }else if(c.includes('analyze')){
        const gap = cmd.replace(/analyze\s*/i,'')||'System Performance';
        knowledgeGaps.push(gap);
        r = {agent:'mentor',tagClass:'tg-m',category:'GAPS',
             message:`Analysis done. Gap found: "${gap}"`};
    }else if(c.includes('fix')||c.includes('gap')){
        if(knowledgeGaps.length){
            const resolved = knowledgeGaps.pop();
            r = {agent:'mentor',tagClass:'tg-m',category:'GAPS',
                 message:`Gap resolved: "${resolved}"`};
        }else{
            r = {agent:'mentor',tagClass:'tg-m',category:'GAPS',
                 message:'No gaps to fix. System nominal.'};
        }
    }else if(c.includes('innov')||c.includes('idea')){
        const idea = cmd.replace(/(generate|create)\s*/i,'')||'New Innovation';
        innovations.push({title:idea,feasibility:'medium'});
        r = {agent:'innovator',tagClass:'tg-i',category:'INNOVATIONS',
             message:`Innovation generated: "${idea}"`};
    }else if(c.includes('exec')||c.includes('task')){
        if(activeTasks.length){
            const t = activeTasks[0];
            t.progress = Math.min(100,t.progress+25);
            r = {agent:'executor',tagClass:'tg-e',category:'TASKS',
                 message:`Executing ${t.id}: ${t.title} (${t.progress}%)`};
            if(t.progress>=100) activeTasks.shift();
        }else{
            r = {agent:'executor',tagClass:'tg-e',category:'TASKS',
                 message:'No tasks in queue'};
        }
    }else{
        r = {agent:'system',tagClass:'tg-r',category:'SYSTEM',
             message:`Command received: "${cmd}"`};
    }
    return r;
}

function updatePanels(result){
    if(activeTasks.length){
        document.getElementById('tasks-panel').innerHTML = activeTasks.map(t=>
            `<div class="stat-row"><span class="stat-l">${t.id}</span><span class="stat-v">${t.title} (${t.progress}%)</span></div>`
        ).join('');
        document.getElementById('tasks-panel').classList.remove('empty');
    }
    if(knowledgeGaps.length){
        document.getElementById('gaps-panel').innerHTML = knowledgeGaps.map(g=>
            `<div class="stat-row"><span class="stat-l">⚠</span><span class="stat-v">${g}</span></div>`
        ).join('');
        document.getElementById('gaps-panel').classList.remove('empty');
    }
    if(innovations.length){
        document.getElementById('innovations-panel').innerHTML = innovations.map(i=>
            `<div class="stat-row"><span class="stat-l">💡</span><span class="stat-v">${i.title} [${i.feasibility}]</span></div>`
        ).join('');
        document.getElementById('innovations-panel').classList.remove('empty');
    }
}

rTabs();rFeed();renderMetrics();
setTimeout(()=>document.getElementById('cmd').focus(),500);
</script>
</body>
</html>
