<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0A0E14">
    <title>JARVIS — Mahedi Muktadir</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

        :root {
            --bg-primary: #0A0E14;
            --bg-secondary: #0F1419;
            --bg-card: #151A22;
            --border: #232A34;
            --text-primary: #DDE4ED;
            --text-secondary: #8899AA;
            --text-muted: #4A5568;
            --accent-green: #00E676;
            --accent-blue: #448AFF;
            --accent-orange: #FF9100;
            --accent-purple: #B388FF;
            --accent-cyan: #40C4FF;
            --accent-pink: #FF80AB;
            --radius: 4px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding-bottom: calc(56px + var(--safe-bottom));
            max-width: 375px;
            margin: 0 auto;
        }

        .topbar {
            position: sticky; top: 0; z-index: 100;
            height: 48px; background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px;
        }
        .top-left h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.1; }
        .top-left .sub { font-size: 7px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .top-right { display: flex; align-items: center; gap: 6px; font-size: 8px; }
        .top-right .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--accent-green); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
        .top-right .node { color: var(--text-muted); }

        .agent-scroll {
            display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
            gap: 6px; padding: 8px 12px;
            background: var(--bg-secondary); border-bottom: 1px solid var(--border);
            scrollbar-width: none;
        }
        .agent-scroll::-webkit-scrollbar { display: none; }
        .agent-card {
            flex-shrink: 0; width: 130px; scroll-snap-align: start;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 8px 10px;
            display: flex; flex-direction: column; gap: 4px;
        }
        .agent-card .ac-top { display: flex; align-items: center; gap: 5px; }
        .agent-card .ac-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
        .d-planning { background: var(--accent-blue); animation: pulse 1.8s infinite; }
        .d-running { background: var(--accent-green); animation: pulse 1s infinite; }
        .d-analyzing { background: var(--accent-orange); animation: pulse 1.2s infinite; }
        .d-idle { background: var(--text-muted); }
        .d-measuring { background: var(--accent-cyan); animation: pulse 2s infinite; }
        .agent-card .ac-name { font-size: 8px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
        .agent-card .ac-status { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
        .agent-card .ac-action { font-size: 7px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .tabs {
            display: flex; overflow-x: auto; scrollbar-width: none;
            background: var(--bg-primary); border-bottom: 1px solid var(--border);
            position: sticky; top: 48px; z-index: 50;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            flex: none; padding: 8px 11px;
            font-family: 'JetBrains Mono', monospace; font-size: 8px;
            text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-muted); background: transparent; border: none;
            border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
        }
        .tab.on { color: var(--text-primary); border-bottom-color: var(--accent-blue); }

        .feed { max-height: 55vh; overflow-y: auto; }
        .feed-item {
            display: flex; gap: 7px; padding: 7px 12px;
            border-bottom: 1px solid var(--border); font-size: 9px; align-items: flex-start;
        }
        .feed-tm { color: var(--text-muted); font-size: 7px; min-width: 46px; white-space: nowrap; }
        .feed-tag {
            font-size: 7px; font-weight: 700; text-transform: uppercase;
            padding: 1px 4px; border-radius: 2px; white-space: nowrap; letter-spacing: 0.2px;
        }
        .tg-s { background: #1a2a3a; color: var(--accent-blue); }
        .tg-e { background: #1a2a1a; color: var(--accent-green); }
        .tg-m { background: #2a1a0a; color: var(--accent-orange); }
        .tg-i { background: #1a0a2a; color: var(--accent-purple); }
        .tg-a { background: #0a1a2a; color: var(--accent-cyan); }
        .tg-r { background: #2a0a1a; color: var(--accent-pink); }
        .feed-msg { color: var(--text-secondary); flex: 1; }
        .feed-more { text-align: center; padding: 10px; font-size: 7px; color: var(--text-muted); opacity: 0.5; font-style: italic; }

        .panels { background: var(--border); }
        .panel {
            background: var(--bg-primary); padding: 10px 12px;
            border-bottom: 1px solid var(--border);
        }
        .panel h3 {
            font-size: 8px; text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--text-secondary); margin-bottom: 6px; font-weight: 700;
        }
        .panel .empty { font-size: 8px; color: var(--text-muted); opacity: 0.7; }
        .stat-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 8px; }
        .stat-l { color: var(--text-muted); }
        .stat-v { color: var(--text-secondary); }

        .cmd-bar {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 375px;
            background: var(--bg-secondary); border-top: 1px solid var(--border);
            padding: 8px 12px; padding-bottom: max(8px, var(--safe-bottom));
            z-index: 100;
        }
        .cmd-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        .cmd-wrap {
            flex: 1; display: flex; align-items: center;
            background: var(--bg-primary); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 0 8px; height: 32px;
        }
        .cmd-pfx { color: var(--accent-blue); font-weight: 700; font-size: 11px; margin-right: 6px; }
        .cmd-wrap input {
            flex: 1; background: transparent; border: none; outline: none;
            color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 9px;
        }
        .cmd-wrap input::placeholder { color: var(--text-muted); opacity: 0.5; }
        .cmd-btn {
            background: var(--accent-blue); color: #FFF; border: none;
            border-radius: var(--radius); padding: 6px 14px;
            font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; white-space: nowrap;
        }
        .cmd-btn:active { opacity: 0.8; }
        .cmd-btn.loading { opacity: 0.6; pointer-events: none; }
        .chips { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            flex: none; padding: 4px 8px; border: 1px solid var(--border);
            border-radius: var(--radius); font-family: 'JetBrains Mono', monospace;
            font-size: 7px; color: var(--text-muted); cursor: pointer; white-space: nowrap;
            background: var(--bg-primary);
        }
        .chip:active { border-color: var(--accent-blue); color: var(--text-primary); }

        .toast {
            position: fixed; top: 54px; left: 50%; transform: translateX(-50%);
            background: var(--bg-card); border: 1px solid var(--accent-green);
            border-radius: var(--radius); padding: 6px 12px;
            font-size: 8px; color: var(--accent-green); z-index: 200;
            animation: fadeInOut 2s ease;
            pointer-events: none;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="top-left">
        <h1>JARVIS</h1>
        <div class="sub">Mahedi Muktadir</div>
    </div>
    <div class="top-right">
        <div class="dot"></div>
        <span style="color:var(--accent-green)">ACTIVE</span>
        <span class="node">— Sakhipur</span>
    </div>
</header>

<div class="agent-scroll" id="agent-scroll"></div>

<nav class="tabs" id="tabs"></nav>

<div class="feed" id="feed"></div>

<div class="panels">
    <div class="panel"><h3>ACTIVE TASKS</h3><div class="empty">No active tasks</div></div>
    <div class="panel"><h3>KNOWLEDGE GAPS</h3><div class="empty">No gaps identified</div></div>
    <div class="panel"><h3>INNOVATIONS</h3><div class="empty">No innovations generated</div></div>
    <div class="panel" id="metrics-panel"><h3>PERFORMANCE METRICS</h3></div>
    <div class="panel" id="sys-panel"><h3>SYSTEM STATUS</h3></div>
</div>

<div class="cmd-bar">
    <div class="cmd-row">
        <div class="cmd-wrap">
            <span class="cmd-pfx">&gt;</span>
            <input id="cmd" placeholder="Type a command..." onkeypress="if(event.key==='Enter')exec()" autocomplete="off">
        </div>
        <button class="cmd-btn" id="run-btn" onclick="exec()">RUN</button>
    </div>
    <div class="chips">
        <span class="chip" onclick="sc('plan today')">plan today</span>
        <span class="chip" onclick="sc('analyze')">analyze</span>
        <span class="chip" onclick="sc('fix gaps')">fix gaps</span>
        <span class="chip" onclick="sc('run loop')">run loop</span>
    </div>
</div>

<script>
// ===== CONFIG =====
const API_BASE = 'http://localhost:8000';  // Change to your backend URL
const OFFLINE_MODE = true;  // Set false when backend running

// ===== DATA =====
const agents = [
    {n:'STRATEGIST',s:'PLANNING',a:'Generating plan...',c:'#448AFF',d:'d-planning',l:'#448AFF'},
    {n:'EXECUTOR',s:'RUNNING',a:'TSK-023 (65%)',c:'#00E676',d:'d-running',l:'#00E676'},
    {n:'MENTOR',s:'ANALYZING',a:'Detecting gaps...',c:'#FF9100',d:'d-analyzing',l:'#FF9100'},
    {n:'INNOVATOR',s:'IDLE',a:'Awaiting trigger...',c:'#B388FF',d:'d-idle',l:'#B388FF'},
    {n:'AMPLIFIER',s:'MEASURING',a:'Collecting data...',c:'#40C4FF',d:'d-measuring',l:'#40C4FF'},
    {n:'REFLECTOR',s:'IDLE',a:'Cycle pending...',c:'#FF80AB',d:'d-idle',l:'#FF80AB'},
];

const feedData = [
    {t:'10:33:42',a:'AMPLIFIER',m:'Performance metrics updated successfully.',g:'tg-a'},
    {t:'10:33:38',a:'MENTOR',m:'Knowledge gap: "Advanced Ad Copy Techniques".',g:'tg-m'},
    {t:'10:33:34',a:'STRATEGIST',m:'Plan updated: Weekly Growth Plan v2.1.',g:'tg-s'},
    {t:'10:33:29',a:'EXECUTOR',m:'Completed TSK-022: Content Research.',g:'tg-e'},
    {t:'10:33:25',a:'EXECUTOR',m:'Started TSK-023: Facebook Ad Campaign.',g:'tg-e'},
    {t:'10:33:20',a:'INNOVATOR',m:'Idea: AI-Powered Ad Creative Generator.',g:'tg-i'},
    {t:'10:33:15',a:'MENTOR',m:'Analyzing: Ad Copywriting skill gap.',g:'tg-m'},
    {t:'10:33:10',a:'AMPLIFIER',m:'Data from 12 sources collected.',g:'tg-a'},
    {t:'10:33:05',a:'STRATEGIST',m:'Generated 5 tasks from objectives.',g:'tg-s'},
    {t:'10:32:58',a:'SYSTEM',m:'Cognitive loop iteration started.',g:'tg-r'},
];

const commandMap = {
    'strategist': 'tg-s',
    'executor': 'tg-e',
    'mentor': 'tg-m',
    'innovator': 'tg-i',
    'amplifier': 'tg-a',
    'reflector': 'tg-r',
    'orchestrator': 'tg-a',
    'system': 'tg-r'
};

const tabs=['ALL','TASKS','GAPS','INNOVATIONS','SYSTEM'];
let cur='ALL';

// ===== RENDER =====
document.getElementById('agent-scroll').innerHTML = agents.map(a=>
    `<div class="agent-card" style="border-left:3px solid ${a.l}">
        <div class="ac-top"><div class="ac-dot ${a.d}"></div><span class="ac-name">${a.n}</span></div>
        <div class="ac-status" style="color:${a.c}">${a.s}</div>
        <div class="ac-action">${a.a}</div>
    </div>`
).join('');

function rTabs(){
    document.getElementById('tabs').innerHTML = tabs.map(t=>
        `<button class="tab${t===cur?' on':''}" onclick="sw('${t}')">${t}</button>`
    ).join('');
}
function sw(t){cur=t;rTabs();rFeed();}
function rFeed(){
    const f = cur==='ALL' ? feedData : feedData.filter(i=>{
        if(cur==='SYSTEM') return i.a==='AMPLIFIER'||i.a==='REFLECTOR'||i.a==='SYSTEM';
        if(cur==='TASKS') return i.a==='STRATEGIST'||i.a==='EXECUTOR';
        if(cur==='GAPS') return i.a==='MENTOR';
        if(cur==='INNOVATIONS') return i.a==='INNOVATOR';
        return false;
    });
    document.getElementById('feed').innerHTML = f.map(i=>
        `<div class="feed-item" style="border-left:3px solid ${i.a==='EXECUTOR'||i.a==='AMPLIFIER'?'var(--accent-green)':i.a==='MENTOR'?'var(--accent-orange)':i.a==='STRATEGIST'?'var(--accent-blue)':i.a==='INNOVATOR'?'var(--accent-purple)':'var(--accent-pink)'}">
            <span class="feed-tm">${i.t}</span>
            <span class="feed-tag ${i.g}">${i.a}</span>
            <span class="feed-msg">${i.m}</span>
        </div>`
    ).join('') + '<div class="feed-more">Swipe up to load more</div>';
}

document.getElementById('metrics-panel').innerHTML = '<h3>PERFORMANCE METRICS</h3>'+
    [{l:'Plan Compliance',v:'—%'},{l:'Tasks Today',v:'—'},{l:'Task Success Rate',v:'—%'},{l:'System Efficiency',v:'—%'}]
    .map(m=>`<div class="stat-row"><span class="stat-l">${m.l}</span><span class="stat-v">${m.v}</span></div>`).join('');

document.getElementById('sys-panel').innerHTML = '<h3>SYSTEM STATUS</h3>'+
    [{l:'Overall Health',v:'—'},{l:'Active Agents',v:'— / 6'},{l:'Queue Length',v:'—'},{l:'Last Cycle',v:'—'}]
    .map(m=>`<div class="stat-row"><span class="stat-l">${m.l}</span><span class="stat-v">${m.v}</span></div>`).join('');

function sc(c){ document.getElementById('cmd').value = c; document.getElementById('cmd').focus(); }

// ===== PHASE 6.2: REAL COMMAND EXECUTION =====
function showToast(msg, color) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    if (color) toast.style.color = color;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
}

async function exec(){
    const input = document.getElementById('cmd');
    const btn = document.getElementById('run-btn');
    const c = input.value.trim();
    if(!c) return;

    // Loading state
    btn.textContent = '...';
    btn.classList.add('loading');
    input.disabled = true;

    try {
        let result;

        if (!OFFLINE_MODE) {
            // Real backend call
            const response = await fetch(`${API_BASE}/command/execute`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: c })
            });
            result = await response.json();
        } else {
            // Offline simulation
            result = simulateCommand(c);
        }

        // Add to feed
        const now = new Date().toLocaleTimeString('en-US', { hour12: false });
        const agent = result.response.agent || 'system';
        const tagClass = commandMap[agent] || 'tg-r';

        feedData.unshift({
            t: now,
            a: agent.toUpperCase(),
            m: result.response.message || `Command executed: ${c}`,
            g: tagClass
        });

        if (cur === 'ALL' || cur === 'SYSTEM') rFeed();

        showToast('✅ ' + result.response.message, 'var(--accent-green)');

    } catch(err) {
        // Fallback offline
        const now = new Date().toLocaleTimeString('en-US', { hour12: false });
        feedData.unshift({
            t: now,
            a: 'SYSTEM',
            m: `Offline command: ${c}`,
            g: 'tg-r'
        });
        if (cur === 'ALL' || cur === 'SYSTEM') rFeed();
        showToast('⚠ Offline: ' + c, 'var(--accent-orange)');
    }

    // Reset
    input.value = '';
    input.disabled = false;
    btn.textContent = 'RUN';
    btn.classList.remove('loading');
    input.focus();
}

function simulateCommand(cmd) {
    const c = cmd.toLowerCase().trim();
    let response = {};

    if (c.includes('plan')) {
        response = {
            agent: 'strategist',
            action: 'create_plan',
            status: 'executed',
            message: `Plan generated: "${cmd}"`,
            tasks_created: 5
        };
    } else if (c.includes('analyze')) {
        response = {
            agent: 'mentor',
            action: 'analyze_gaps',
            status: 'executed',
            message: `Analysis completed: "${cmd}"`,
            gaps_found: 3
        };
    } else if (c.includes('fix') || c.includes('gap')) {
        response = {
            agent: 'mentor',
            action: 'resolve_gaps',
            status: 'executed',
            message: `Gap resolution initiated: "${cmd}"`,
            gaps_resolved: 2
        };
    } else if (c.includes('loop') || c.includes('cycle')) {
        response = {
            agent: 'orchestrator',
            action: 'run_cognitive_cycle',
            status: 'executed',
            message: 'Cognitive loop iteration started',
            pipeline: ['perceive', 'reason', 'act', 'reflect']
        };
    } else if (c.includes('execute') || c.includes('task')) {
        response = {
            agent: 'executor',
            action: 'execute_tasks',
            status: 'executed',
            message: `Task execution started: "${cmd}"`,
            tasks_run: 3
        };
    } else if (c.includes('innov') || c.includes('idea')) {
        response = {
            agent: 'innovator',
            action: 'generate_ideas',
            status: 'executed',
            message: `Innovation generated: "${cmd}"`,
            ideas: 1
        };
    } else {
        response = {
            agent: 'system',
            action: 'process',
            status: 'received',
            message: `Command received: "${cmd}"`
        };
    }

    return { success: true, response };
}

// ===== INIT =====
rTabs();
rFeed();

// Auto-focus command on load
setTimeout(() => document.getElementById('cmd').focus(), 500);
</script>
</body>
</html>
