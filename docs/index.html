<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0A0E14">
    <title>JARVIS — Mahedi Muktadir</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

        :root {
            --bg-primary: #0A0E14;
            --bg-secondary: #0F1419;
            --bg-card: #151A22;
            --border: #232A34;
            --text-primary: #DDE4ED;
            --text-secondary: #8899AA;
            --text-muted: #4A5568;
            --accent-green: #00E676;
            --accent-blue: #448AFF;
            --accent-orange: #FF9100;
            --accent-purple: #B388FF;
            --accent-cyan: #40C4FF;
            --accent-pink: #FF80AB;
            --radius: 4px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding-bottom: calc(56px + var(--safe-bottom));
            margin: 0 auto;
        }

        /* ===== MOBILE: 375px (default) ===== */
        .container { max-width: 375px; margin: 0 auto; }

        /* Topbar */
        .topbar {
            position: sticky; top: 0; z-index: 100; height: 48px;
            background: var(--bg-secondary); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
        }
        .top-left h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.1; }
        .top-left .sub { font-size: 7px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .top-right { display: flex; align-items: center; gap: 6px; font-size: 8px; }
        .top-right .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-green); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
        .top-right .node { color: var(--text-muted); }
        .desktop-only { display: none; }

        /* Agent Scroll */
        .agent-scroll {
            display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
            gap: 6px; padding: 8px 12px; background: var(--bg-secondary);
            border-bottom: 1px solid var(--border); scrollbar-width: none;
        }
        .agent-scroll::-webkit-scrollbar { display: none; }
        .agent-card {
            flex-shrink: 0; width: 130px; scroll-snap-align: start;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 8px 10px;
            display: flex; flex-direction: column; gap: 4px; transition: border-color 0.2s;
        }
        .agent-card:hover { border-color: var(--accent-blue); }
        .agent-card .ac-top { display: flex; align-items: center; gap: 5px; }
        .agent-card .ac-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
        .d-planning { background: var(--accent-blue); animation: pulse 1.8s infinite; }
        .d-running { background: var(--accent-green); animation: pulse 1s infinite; }
        .d-analyzing { background: var(--accent-orange); animation: pulse 1.2s infinite; }
        .d-idle { background: var(--text-muted); }
        .d-measuring { background: var(--accent-cyan); animation: pulse 2s infinite; }
        .agent-card .ac-name { font-size: 8px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
        .agent-card .ac-status { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
        .agent-card .ac-action { font-size: 7px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Tabs */
        .tabs {
            display: flex; overflow-x: auto; scrollbar-width: none;
            background: var(--bg-primary); border-bottom: 1px solid var(--border);
            position: sticky; top: 48px; z-index: 50;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            flex: none; padding: 8px 11px; font-family: 'JetBrains Mono', monospace;
            font-size: 8px; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-muted); background: transparent; border: none;
            border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
        }
        .tab.on { color: var(--text-primary); border-bottom-color: var(--accent-blue); }

        /* Main Layout */
        .main-layout { display: flex; flex-direction: column; }
        .feed-section { width: 100%; }
        .panels-section { width: 100%; }

        /* Feed */
        .feed { max-height: 55vh; overflow-y: auto; }
        .feed-item {
            display: flex; gap: 7px; padding: 7px 12px;
            border-bottom: 1px solid var(--border); font-size: 9px; align-items: flex-start;
        }
        .feed-tm { color: var(--text-muted); font-size: 7px; min-width: 46px; white-space: nowrap; }
        .feed-tag {
            font-size: 7px; font-weight: 700; text-transform: uppercase;
            padding: 1px 4px; border-radius: 2px; white-space: nowrap; letter-spacing: 0.2px;
        }
        .tg-s { background: #1a2a3a; color: var(--accent-blue); }
        .tg-e { background: #1a2a1a; color: var(--accent-green); }
        .tg-m { background: #2a1a0a; color: var(--accent-orange); }
        .tg-i { background: #1a0a2a; color: var(--accent-purple); }
        .tg-a { background: #0a1a2a; color: var(--accent-cyan); }
        .tg-r { background: #2a0a1a; color: var(--accent-pink); }
        .feed-msg { color: var(--text-secondary); flex: 1; }
        .feed-more { text-align: center; padding: 10px; font-size: 7px; color: var(--text-muted); opacity: 0.5; font-style: italic; }

        /* Panels */
        .panels { background: var(--border); }
        .panel {
            background: var(--bg-primary); padding: 10px 12px; border-bottom: 1px solid var(--border);
        }
        .panel h3 {
            font-size: 8px; text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--text-secondary); margin-bottom: 6px; font-weight: 700;
        }
        .panel .empty { font-size: 8px; color: var(--text-muted); opacity: 0.7; }
        .stat-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 8px; }
        .stat-l { color: var(--text-muted); }
        .stat-v { color: var(--text-secondary); }

        /* Command Bar */
        .cmd-bar {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 375px; background: var(--bg-secondary);
            border-top: 1px solid var(--border); padding: 8px 12px;
            padding-bottom: max(8px, var(--safe-bottom)); z-index: 100;
        }
        .cmd-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        .cmd-wrap {
            flex: 1; display: flex; align-items: center; background: var(--bg-primary);
            border: 1px solid var(--border); border-radius: var(--radius); padding: 0 8px; height: 32px;
        }
        .cmd-pfx { color: var(--accent-blue); font-weight: 700; font-size: 11px; margin-right: 6px; }
        .cmd-wrap input {
            flex: 1; background: transparent; border: none; outline: none;
            color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 9px;
        }
        .cmd-btn {
            background: var(--accent-blue); color: #FFF; border: none; border-radius: var(--radius);
            padding: 6px 14px; font-family: 'JetBrains Mono', monospace; font-size: 9px;
            font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer;
            transition: opacity 0.2s;
        }
        .cmd-btn.loading { opacity: 0.5; pointer-events: none; }
        .chips { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            flex: none; padding: 4px 8px; border: 1px solid var(--border);
            border-radius: var(--radius); font-family: 'JetBrains Mono', monospace;
            font-size: 7px; color: var(--text-muted); cursor: pointer; background: var(--bg-primary);
        }
        .chip:active { border-color: var(--accent-blue); color: var(--text-primary); }

        .toast {
            position: fixed; top: 54px; left: 50%; transform: translateX(-50%);
            background: var(--bg-card); border: 1px solid var(--accent-green);
            border-radius: var(--radius); padding: 6px 12px; font-size: 8px;
            color: var(--accent-green); z-index: 200; pointer-events: none;
            animation: toastIn 2s ease forwards;
        }
        @keyframes toastIn {
            0%{opacity:0;transform:translateX(-50%) translateY(-8px)}
            10%{opacity:1;transform:translateX(-50%) translateY(0)}
            80%{opacity:1}
            100%{opacity:0}
        }

        /* ===== TABLET: 768px+ ===== */
        @media (min-width: 768px) {
            body { font-size: 12px; padding-bottom: calc(60px + var(--safe-bottom)); }
            .container { max-width: 768px; }
            .topbar { height: 52px; padding: 0 16px; }
            .top-left h1 { font-size: 18px; }
            .top-left .sub { font-size: 8px; }
            .top-right { font-size: 9px; }
            .agent-scroll { gap: 8px; padding: 10px 16px; }
            .agent-card { width: 150px; padding: 10px 12px; }
            .agent-card .ac-name { font-size: 9px; }
            .agent-card .ac-status { font-size: 10px; }
            .agent-card .ac-action { font-size: 8px; }
            .tabs { top: 52px; }
            .tab { font-size: 9px; padding: 10px 14px; }
            .main-layout { flex-direction: row; gap: 8px; padding: 8px; }
            .feed-section { flex: 1; min-width: 0; }
            .panels-section { flex: 1; min-width: 0; }
            .feed { max-height: calc(100vh - 240px); }
            .feed-item { font-size: 10px; padding: 8px 14px; }
            .feed-tm { font-size: 8px; min-width: 55px; }
            .feed-tag { font-size: 8px; }
            .panel { padding: 12px 14px; }
            .panel h3 { font-size: 9px; }
            .stat-row { font-size: 9px; }
            .cmd-bar { max-width: 768px; padding: 10px 16px; }
            .cmd-wrap { height: 36px; }
            .cmd-wrap input { font-size: 10px; }
            .cmd-btn { font-size: 10px; padding: 8px 16px; }
            .chip { font-size: 8px; padding: 5px 10px; }
        }

        /* ===== DESKTOP: 1440px+ ===== */
        @media (min-width: 1440px) {
            body { font-size: 13px; }
            .container { max-width: 1440px; display: flex; flex-direction: column; }
            .topbar { height: 56px; padding: 0 24px; position: relative; }
            .top-left h1 { font-size: 22px; }
            .top-left .sub { font-size: 9px; }
            .top-right { font-size: 10px; gap: 10px; }
            .desktop-only { display: flex; }
            .agent-scroll { gap: 10px; padding: 12px 24px; justify-content: flex-start; }
            .agent-card { width: 170px; padding: 12px 14px; cursor: pointer; }
            .agent-card .ac-name { font-size: 10px; }
            .agent-card .ac-status { font-size: 11px; }
            .agent-card .ac-action { font-size: 9px; }
            .tabs { position: static; justify-content: flex-start; padding: 0 24px; }
            .tab { font-size: 10px; padding: 12px 18px; cursor: pointer; }
            .main-layout { flex-direction: row; gap: 12px; padding: 12px 24px; }
            .feed-section { flex: 0.6; }
            .panels-section { flex: 0.4; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            .panels-section .panel:last-child { grid-column: span 2; }
            .feed { max-height: calc(100vh - 300px); }
            .feed-item { font-size: 11px; padding: 10px 16px; }
            .feed-tm { font-size: 9px; min-width: 65px; }
            .feed-tag { font-size: 9px; }
            .panel { padding: 14px 16px; border: 1px solid var(--border); border-bottom: none; }
            .panel h3 { font-size: 10px; }
            .stat-row { font-size: 10px; }
            .cmd-bar { max-width: 1440px; padding: 12px 24px; }
            .cmd-wrap { height: 40px; }
            .cmd-wrap input { font-size: 12px; }
            .cmd-btn { font-size: 11px; padding: 10px 22px; }
            .chip { font-size: 9px; padding: 6px 14px; cursor: pointer; }
            .chip:hover { border-color: var(--accent-blue); color: var(--text-primary); }
        }
    </style>
</head>
<body>
<div class="container">
    <header class="topbar">
        <div class="top-left">
            <h1>JARVIS</h1>
            <div class="sub">Mahedi Muktadir</div>
        </div>
        <div class="top-right">
            <span class="desktop-only" style="color:var(--text-muted);margin-right:8px;">v7.0.0</span>
            <span class="desktop-only" style="color:var(--text-muted);">NODE:</span>
            <span>Sakhipur</span>
            <div class="dot"></div>
            <span style="color:var(--accent-green)">ACTIVE</span>
        </div>
    </header>

    <div class="agent-scroll" id="agent-scroll"></div>

    <nav class="tabs" id="tabs"></nav>

    <div class="main-layout">
        <div class="feed-section">
            <div class="feed" id="feed"></div>
        </div>
        <div class="panels-section">
            <div class="panel"><h3>ACTIVE TASKS</h3><div id="tasks-panel" class="empty">No active tasks</div></div>
            <div class="panel"><h3>KNOWLEDGE GAPS</h3><div id="gaps-panel" class="empty">No gaps identified</div></div>
            <div class="panel"><h3>INNOVATIONS</h3><div id="innovations-panel" class="empty">No innovations generated</div></div>
            <div class="panel" id="metrics-panel"><h3>PERFORMANCE METRICS</h3></div>
            <div class="panel" id="sys-panel"><h3>SYSTEM STATUS</h3></div>
        </div>
    </div>

    <div class="cmd-bar">
        <div class="cmd-row">
            <div class="cmd-wrap">
                <span class="cmd-pfx">&gt;</span>
                <input id="cmd" placeholder="Type a command..." onkeypress="if(event.key==='Enter')exec()" autocomplete="off">
            </div>
            <button class="cmd-btn" id="run-btn" onclick="exec()">RUN</button>
        </div>
        <div class="chips">
            <span class="chip" onclick="sc('plan today')">plan today</span>
            <span class="chip" onclick="sc('analyze')">analyze</span>
            <span class="chip" onclick="sc('fix gaps')">fix gaps</span>
            <span class="chip" onclick="sc('run loop')">run loop</span>
            <span class="chip desktop-only" onclick="sc('execute tasks')">execute tasks</span>
            <span class="chip desktop-only" onclick="sc('generate innovation')">generate idea</span>
        </div>
    </div>
</div>

<script>
const agents = [
    {n:'STRATEGIST',s:'PLANNING',a:'Generating plan...',c:'#448AFF',d:'d-planning',l:'#448AFF'},
    {n:'EXECUTOR',s:'RUNNING',a:'TSK-023 (65%)',c:'#00E676',d:'d-running',l:'#00E676'},
    {n:'MENTOR',s:'ANALYZING',a:'Detecting gaps...',c:'#FF9100',d:'d-analyzing',l:'#FF9100'},
    {n:'INNOVATOR',s:'IDLE',a:'Awaiting trigger...',c:'#B388FF',d:'d-idle',l:'#B388FF'},
    {n:'AMPLIFIER',s:'MEASURING',a:'Collecting data...',c:'#40C4FF',d:'d-measuring',l:'#40C4FF'},
    {n:'REFLECTOR',s:'IDLE',a:'Cycle pending...',c:'#FF80AB',d:'d-idle',l:'#FF80AB'},
];

let feedData = [
    {t:'10:33:42',a:'AMPLIFIER',m:'Performance metrics updated successfully.',g:'tg-a',cat:'SYSTEM'},
    {t:'10:33:38',a:'MENTOR',m:'Knowledge gap: "Advanced Ad Copy Techniques".',g:'tg-m',cat:'GAPS'},
    {t:'10:33:34',a:'STRATEGIST',m:'Plan updated: Weekly Growth Plan v2.1.',g:'tg-s',cat:'TASKS'},
    {t:'10:33:29',a:'EXECUTOR',m:'Completed TSK-022: Content Research.',g:'tg-e',cat:'TASKS'},
    {t:'10:33:25',a:'EXECUTOR',m:'Started TSK-023: Facebook Ad Campaign.',g:'tg-e',cat:'TASKS'},
    {t:'10:33:20',a:'INNOVATOR',m:'Idea: AI-Powered Ad Creative Generator.',g:'tg-i',cat:'INNOVATIONS'},
    {t:'10:33:15',a:'MENTOR',m:'Analyzing: Ad Copywriting skill gap.',g:'tg-m',cat:'GAPS'},
    {t:'10:33:10',a:'AMPLIFIER',m:'Data from 12 sources collected.',g:'tg-a',cat:'SYSTEM'},
    {t:'10:33:05',a:'STRATEGIST',m:'Generated 5 tasks from objectives.',g:'tg-s',cat:'TASKS'},
    {t:'10:32:58',a:'SYSTEM',m:'Cognitive loop iteration started.',g:'tg-r',cat:'SYSTEM'},
];

let activeTasks = [], knowledgeGaps = [], innovations = [], runCount = 0;
const tabs=['ALL','TASKS','GAPS','INNOVATIONS','SYSTEM'];
let cur='ALL';
const agentColors = {STRATEGIST:'var(--accent-green)',EXECUTOR:'var(--accent-green)',MENTOR:'var(--accent-orange)',INNOVATOR:'var(--accent-purple)',AMPLIFIER:'var(--accent-green)',REFLECTOR:'var(--accent-pink)',SYSTEM:'var(--accent-pink)',ORCHESTRATOR:'var(--accent-cyan)'};

document.getElementById('agent-scroll').innerHTML = agents.map(a=>
    `<div class="agent-card" style="border-left:3px solid ${a.l}">
        <div class="ac-top"><div class="ac-dot ${a.d}"></div><span class="ac-name">${a.n}</span></div>
        <div class="ac-status" style="color:${a.c}">${a.s}</div>
        <div class="ac-action">${a.a}</div>
    </div>`
).join('');

function rTabs(){document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="tab${t===cur?' on':''}" onclick="sw('${t}')">${t}</button>`).join('');}
function sw(t){cur=t;rTabs();rFeed();}
function rFeed(){
    const f=cur==='ALL'?feedData:feedData.filter(i=>i.cat===cur);
    document.getElementById('feed').innerHTML=(f.length?f.map(i=>
        `<div class="feed-item" style="border-left:3px solid ${agentColors[i.a]||'var(--accent-pink)'}">
            <span class="feed-tm">${i.t}</span><span class="feed-tag ${i.g}">${i.a}</span><span class="feed-msg">${i.m}</span>
        </div>`
    ).join(''):'<div class="feed-more">No entries</div>')+'<div class="feed-more">Swipe up to load more</div>';
}

function renderMetrics(){
    document.getElementById('metrics-panel').innerHTML='<h3>PERFORMANCE METRICS</h3>'+
        [{l:'Plan Compliance',v:runCount>0?Math.min(100,85+runCount)+'%':'—%'},{l:'Tasks Today',v:activeTasks.length||'—'},{l:'Task Success Rate',v:runCount>0?Math.min(100,90+runCount)+'%':'—%'},{l:'System Efficiency',v:runCount>0?Math.min(100,88+runCount*2)+'%':'—%'}]
        .map(m=>`<div class="stat-row"><span class="stat-l">${m.l}</span><span class="stat-v">${m.v}</span></div>`).join('');
    document.getElementById('sys-panel').innerHTML='<h3>SYSTEM STATUS</h3>'+
        [{l:'Overall Health',v:runCount>0?'NOMINAL':'—'},{l:'Active Agents',v:'6 / 6'},{l:'Queue Length',v:activeTasks.length||'—'},{l:'Last Cycle',v:runCount>0?new Date().toLocaleTimeString('en-US',{hour12:false}):'—'}]
        .map(m=>`<div class="stat-row"><span class="stat-l">${m.l}</span><span class="stat-v">${m.v}</span></div>`).join('');
}

function sc(c){document.getElementById('cmd').value=c;document.getElementById('cmd').focus();}
function showToast(msg,color){const t=document.createElement('div');t.className='toast';t.textContent=msg;if(color)t.style.color=color;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

function exec(){
    const input=document.getElementById('cmd'),btn=document.getElementById('run-btn'),c=input.value.trim();
    if(!c)return;
    btn.textContent='...';btn.classList.add('loading');input.disabled=true;
    const result=simulateCommand(c);runCount++;
    const now=new Date().toLocaleTimeString('en-US',{hour12:false});
    feedData.unshift({t:now,a:result.agent.toUpperCase(),m:result.message,g:result.tagClass,cat:result.category});
    if(cur==='ALL'||cur===result.category)rFeed();
    updatePanels(result);renderMetrics();
    showToast('✅ '+result.message,'var(--accent-green)');
    input.value='';input.disabled=false;btn.textContent='RUN';btn.classList.remove('loading');input.focus();
}

function simulateCommand(cmd){
    const c=cmd.toLowerCase().trim();let r={};
    if(c.includes('plan')){const tid='TSK-'+String(activeTasks.length+24).padStart(3,'0');activeTasks.push({id:tid,title:cmd,progress:0});r={agent:'strategist',tagClass:'tg-s',category:'TASKS',message:`Plan: "${cmd}" → ${tid}`};}
    else if(c.includes('loop')||c.includes('cycle')){r={agent:'orchestrator',tagClass:'tg-a',category:'SYSTEM',message:'Cognitive loop: Perceive→Reason→Act→Reflect done'};}
    else if(c.includes('analyze')){const g=cmd.replace(/analyze\s*/i,'')||'System';knowledgeGaps.push(g);r={agent:'mentor',tagClass:'tg-m',category:'GAPS',message:`Analysis done. Gap: "${g}"`};}
    else if(c.includes('fix')||c.includes('gap')){if(knowledgeGaps.length){const res=knowledgeGaps.pop();r={agent:'mentor',tagClass:'tg-m',category:'GAPS',message:`Gap resolved: "${res}"`};}else{r={agent:'mentor',tagClass:'tg-m',category:'GAPS',message:'No gaps. System nominal.'};}}
    else if(c.includes('innov')||c.includes('idea')){const idea=cmd.replace(/(generate|create)\s*/i,'')||'Innovation';innovations.push({title:idea,feasibility:'medium'});r={agent:'innovator',tagClass:'tg-i',category:'INNOVATIONS',message:`Innovation: "${idea}"`};}
    else if(c.includes('exec')||c.includes('task')){if(activeTasks.length){const t=activeTasks[0];t.progress=Math.min(100,t.progress+25);r={agent:'executor',tagClass:'tg-e',category:'TASKS',message:`Executing ${t.id}: ${t.title} (${t.progress}%)`};if(t.progress>=100)activeTasks.shift();}else{r={agent:'executor',tagClass:'tg-e',category:'TASKS',message:'No tasks in queue'};}}
    else{r={agent:'system',tagClass:'tg-r',category:'SYSTEM',message:`Command: "${cmd}"`};}
    return r;
}

function updatePanels(result){
    if(activeTasks.length){document.getElementById('tasks-panel').innerHTML=activeTasks.map(t=>`<div class="stat-row"><span class="stat-l">${t.id}</span><span class="stat-v">${t.title} (${t.progress}%)</span></div>`).join('');document.getElementById('tasks-panel').classList.remove('empty');}
    if(knowledgeGaps.length){document.getElementById('gaps-panel').innerHTML=knowledgeGaps.map(g=>`<div class="stat-row"><span class="stat-l">⚠</span><span class="stat-v">${g}</span></div>`).join('');document.getElementById('gaps-panel').classList.remove('empty');}
    if(innovations.length){document.getElementById('innovations-panel').innerHTML=innovations.map(i=>`<div class="stat-row"><span class="stat-l">💡</span><span class="stat-v">${i.title} [${i.feasibility}]</span></div>`).join('');document.getElementById('innovations-panel').classList.remove('empty');}
}

rTabs();rFeed();renderMetrics();setTimeout(()=>document.getElementById('cmd').focus(),500);
</script>
