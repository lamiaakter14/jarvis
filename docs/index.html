<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0A0E14">
    <title>JARVIS — Mahedi Muktadir</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
        :root {
            --bg-primary: #0A0E14; --bg-secondary: #0F1419; --bg-card: #151A22;
            --border: #232A34; --text-primary: #DDE4ED; --text-secondary: #8899AA;
            --text-muted: #4A5568; --accent-green: #00E676; --accent-blue: #448AFF;
            --accent-orange: #FF9100; --accent-purple: #B388FF; --accent-cyan: #40C4FF;
            --accent-pink: #FF80AB; --radius: 4px; --safe-bottom: env(safe-area-inset-bottom,0px);
        }
        *{margin:0;padding:0;box-sizing:border-box}html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
        body{background:var(--bg-primary);color:var(--text-primary);font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(56px + var(--safe-bottom));margin:0 auto}
        .container{max-width:375px;margin:0 auto}
        .topbar{position:sticky;top:0;z-index:100;height:48px;background:var(--bg-secondary);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px}
        .top-left h1{font-size:16px;font-weight:700;letter-spacing:-.3px;line-height:1.1}
        .top-left .sub{font-size:7px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
        .top-right{display:flex;align-items:center;gap:6px;font-size:8px}
        .top-right .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-green);animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
        .live-dot{animation:pulse 1s infinite !important}
        .agent-scroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:6px;padding:8px 12px;background:var(--bg-secondary);border-bottom:1px solid var(--border);scrollbar-width:none}
        .agent-scroll::-webkit-scrollbar{display:none}
        .agent-card{flex-shrink:0;width:130px;scroll-snap-align:start;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;display:flex;flex-direction:column;gap:4px;transition:all .3s}
        .agent-card.active-card{border-color:var(--accent-green);box-shadow:0 0 8px rgba(0,230,118,.15)}
        .agent-card .ac-top{display:flex;align-items:center;gap:5px}
        .agent-card .ac-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;transition:background .3s}
        .dot-active{background:var(--accent-green);animation:pulse .8s infinite}
        .dot-running{background:var(--accent-blue);animation:pulse 1s infinite}
        .dot-analyzing{background:var(--accent-orange);animation:pulse 1.2s infinite}
        .dot-idle{background:var(--text-muted)}
        .agent-card .ac-name{font-size:8px;text-transform:uppercase;color:var(--text-muted);letter-spacing:.5px}
        .agent-card .ac-status{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
        .agent-card .ac-action{font-size:7px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

        .tabs{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--bg-primary);border-bottom:1px solid var(--border);position:sticky;top:48px;z-index:50}
        .tabs::-webkit-scrollbar{display:none}
        .tab{flex:none;padding:8px 11px;font-family:'JetBrains Mono',monospace;font-size:8px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
        .tab.on{color:var(--text-primary);border-bottom-color:var(--accent-blue)}
        .tab .badge{font-size:7px;background:var(--accent-blue);color:#fff;padding:1px 4px;border-radius:2px;margin-left:4px}

        .main-layout{display:flex;flex-direction:column}
        .feed{max-height:55vh;overflow-y:auto}
        .feed-item{display:flex;gap:7px;padding:7px 12px;border-bottom:1px solid var(--border);font-size:9px;align-items:flex-start;animation:slideIn .3s ease}
        @keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
        .feed-item.new-item{background:rgba(68,138,255,.08)}
        .feed-tm{color:var(--text-muted);font-size:7px;min-width:46px;white-space:nowrap}
        .feed-tag{font-size:7px;font-weight:700;text-transform:uppercase;padding:1px 4px;border-radius:2px;white-space:nowrap;letter-spacing:.2px}
        .tg-s{background:#1a2a3a;color:var(--accent-blue)}.tg-e{background:#1a2a1a;color:var(--accent-green)}.tg-m{background:#2a1a0a;color:var(--accent-orange)}.tg-i{background:#1a0a2a;color:var(--accent-purple)}.tg-a{background:#0a1a2a;color:var(--accent-cyan)}.tg-r{background:#2a0a1a;color:var(--accent-pink)}
        .feed-msg{color:var(--text-secondary);flex:1}

        .panels{background:var(--border)}
        .panel{background:var(--bg-primary);padding:10px 12px;border-bottom:1px solid var(--border)}
        .panel h3{font-size:8px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-secondary);margin-bottom:6px;font-weight:700}
        .stat-row{display:flex;justify-content:space-between;padding:3px 0;font-size:8px}
        .stat-l{color:var(--text-muted)}.stat-v{color:var(--text-secondary)}
        .trend-up{color:var(--accent-green);font-size:7px;margin-left:4px}
        .trend-down{color:var(--accent-red);font-size:7px;margin-left:4px}
        .gap-row{display:flex;align-items:center;gap:6px;padding:2px 0}
        .gap-icon{color:var(--accent-orange);font-size:10px}
        .gap-text{font-size:8px;color:var(--text-secondary)}
        .innovation-row{display:flex;align-items:center;gap:6px;padding:2px 0}
        .innovation-icon{color:var(--accent-purple);font-size:10px}
        .innovation-text{font-size:8px;color:var(--text-secondary);flex:1}
        .feasibility-badge{font-size:6px;text-transform:uppercase;padding:1px 4px;border-radius:2px;font-weight:700}
        .feas-high{background:#1a3a2a;color:var(--accent-green)}.feas-medium{background:#2a2a1a;color:var(--accent-orange)}
        .task-row{display:flex;align-items:center;gap:6px;padding:2px 0}
        .task-id-text{font-size:7px;color:var(--accent-blue);font-weight:700;min-width:45px}
        .task-title-text{font-size:8px;color:var(--text-secondary);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .progress-mini{width:40px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
        .progress-fill-mini{height:100%;border-radius:2px;transition:width .5s ease}
        .prog-high{background:var(--accent-green)}.prog-medium{background:var(--accent-blue)}.prog-low{background:var(--accent-orange)}
        .task-pct-text{font-size:7px;color:var(--text-muted);min-width:25px;text-align:right}

        .cmd-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:375px;background:var(--bg-secondary);border-top:1px solid var(--border);padding:8px 12px;padding-bottom:max(8px,var(--safe-bottom));z-index:100}
        .cmd-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
        .cmd-wrap{flex:1;display:flex;align-items:center;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius);padding:0 8px;height:32px}
        .cmd-pfx{color:var(--accent-blue);font-weight:700;font-size:11px;margin-right:6px}
        .cmd-wrap input{flex:1;background:transparent;border:none;outline:none;color:var(--text-primary);font-family:'JetBrains Mono',monospace;font-size:9px}
        .cmd-btn{background:var(--accent-blue);color:#FFF;border:none;border-radius:var(--radius);padding:6px 14px;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;transition:opacity .2s}
        .cmd-btn.loading{opacity:.5;pointer-events:none}
        .chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
        .chips::-webkit-scrollbar{display:none}
        .chip{flex:none;padding:4px 8px;border:1px solid var(--border);border-radius:var(--radius);font-family:'JetBrains Mono',monospace;font-size:7px;color:var(--text-muted);cursor:pointer;background:var(--bg-primary)}
        .chip:active{border-color:var(--accent-blue);color:var(--text-primary)}
        .toast{position:fixed;top:54px;left:50%;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--accent-green);border-radius:var(--radius);padding:6px 12px;font-size:8px;color:var(--accent-green);z-index:200;pointer-events:none;animation:toastIn 2s ease forwards}
        @keyframes toastIn{0%{opacity:0;transform:translateX(-50%) translateY(-8px)}10%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}
        .status-bar{text-align:center;padding:6px;font-size:7px;color:var(--text-muted);border-top:1px solid var(--border);display:flex;justify-content:center;gap:12px}
        @media(min-width:768px){.container{max-width:768px}.topbar{height:52px;padding:0 16px}.top-left h1{font-size:18px}.agent-scroll{gap:8px;padding:10px 16px}.agent-card{width:150px}.tabs{top:52px}.tab{font-size:9px;padding:10px 14px}.main-layout{flex-direction:row;gap:8px;padding:8px}.feed{max-height:calc(100vh - 240px)}.feed-item{font-size:10px;padding:8px 14px}.cmd-bar{max-width:768px;padding:10px 16px}}
        @media(min-width:1440px){.container{max-width:1440px;display:flex;flex-direction:column}.topbar{height:56px;padding:0 24px}.top-left h1{font-size:22px}.agent-card{width:170px}.tabs{position:static;padding:0 24px}.tab{font-size:10px;padding:12px 18px}.main-layout{flex-direction:row;gap:12px;padding:12px 24px}.feed-section{flex:.6}.panels-section{flex:.4;display:grid;grid-template-columns:1fr 1fr;gap:8px}.cmd-bar{max-width:1440px;padding:12px 24px}}
    </style>
</head>
<body>
<div class="container">
    <header class="topbar">
        <div class="top-left"><h1>JARVIS</h1><div class="sub">Mahedi Muktadir</div></div>
        <div class="top-right">
            <span>Sakhipur</span><div class="dot live-dot" id="live-dot"></div><span style="color:var(--accent-green)" id="sys-mode">ACTIVE</span>
        </div>
    </header>
    <div class="agent-scroll" id="agent-scroll"></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="main-layout">
        <div class="feed-section"><div class="feed" id="feed"></div></div>
        <div class="panels-section">
            <div class="panel"><h3>ACTIVE TASKS</h3><div id="tasks-panel"></div></div>
            <div class="panel"><h3>KNOWLEDGE GAPS</h3><div id="gaps-panel"></div></div>
            <div class="panel"><h3>INNOVATIONS</h3><div id="innovations-panel"></div></div>
            <div class="panel" id="metrics-panel"><h3>PERFORMANCE METRICS</h3></div>
            <div class="panel" id="sys-panel"><h3>SYSTEM STATUS</h3></div>
        </div>
    </div>
    <div class="status-bar">
        <span id="clock">--:--:--</span>
        <span>|</span>
        <span>Cycle: <span id="cycle-count">0</span></span>
        <span>|</span>
        <span>v9.0.0</span>
    </div>
    <div class="cmd-bar">
        <div class="cmd-row">
            <div class="cmd-wrap"><span class="cmd-pfx">&gt;</span><input id="cmd" placeholder="Type a command..." onkeypress="if(event.key==='Enter')exec()" autocomplete="off"></div>
            <button class="cmd-btn" id="run-btn" onclick="exec()">RUN</button>
        </div>
        <div class="chips">
            <span class="chip" onclick="setChip('plan today')">plan today</span>
            <span class="chip" onclick="setChip('analyze')">analyze</span>
            <span class="chip" onclick="setChip('fix gaps')">fix gaps</span>
            <span class="chip" onclick="setChip('run loop')">run loop</span>
        </div>
    </div>
</div>

<script>
// ===== DYNAMIC STATE =====
const agentStates = [
    {n:'STRATEGIST',states:['PLANNING','ACTIVE','IDLE'],actions:['Generating tasks...','Analyzing objectives...','Awaiting input...'],c:'#448AFF',dotClass:'dot-active'},
    {n:'EXECUTOR',states:['RUNNING','ACTIVE','IDLE'],actions:['TSK-023 (65%)','TSK-024 (28%)','Queue empty'],c:'#00E676',dotClass:'dot-running'},
    {n:'MENTOR',states:['ANALYZING','IDLE'],actions:['Detecting gaps...','Scanning complete'],c:'#FF9100',dotClass:'dot-analyzing'},
    {n:'INNOVATOR',states:['IDLE','GENERATING'],actions:['Awaiting trigger...','Idea generation...'],c:'#B388FF',dotClass:'dot-idle'},
    {n:'AMPLIFIER',states:['MEASURING','ACTIVE'],actions:['Collecting data...','Broadcasting...'],c:'#40C4FF',dotClass:'dot-running'},
    {n:'REFLECTOR',states:['IDLE','REFLECTING'],actions:['Cycle pending...','Reflecting...'],c:'#FF80AB',dotClass:'dot-idle'}
];

let agents = agentStates.map(a => ({...a, currentState:0, currentAction:0}));
let feedData=[{t:'10:33:42',a:'AMPLIFIER',m:'Performance metrics updated successfully.',g:'tg-a',cat:'SYSTEM'},{t:'10:33:38',a:'MENTOR',m:'Knowledge gap: "Advanced Ad Copy Techniques".',g:'tg-m',cat:'GAPS'},{t:'10:33:34',a:'STRATEGIST',m:'Plan updated: Weekly Growth Plan v2.1.',g:'tg-s',cat:'TASKS'},{t:'10:33:29',a:'EXECUTOR',m:'Completed TSK-022: Content Research.',g:'tg-e',cat:'TASKS'},{t:'10:33:25',a:'EXECUTOR',m:'Started TSK-023: Facebook Ad Campaign.',g:'tg-e',cat:'TASKS'},{t:'10:33:20',a:'INNOVATOR',m:'Idea: AI-Powered Ad Creative Generator.',g:'tg-i',cat:'INNOVATIONS'},{t:'10:33:15',a:'MENTOR',m:'Analyzing: Ad Copywriting skill gap.',g:'tg-m',cat:'GAPS'},{t:'10:33:10',a:'AMPLIFIER',m:'Data from 12 sources collected.',g:'tg-a',cat:'SYSTEM'},{t:'10:33:05',a:'STRATEGIST',m:'Generated 5 tasks from objectives.',g:'tg-s',cat:'TASKS'},{t:'10:32:58',a:'SYSTEM',m:'Cognitive loop iteration started.',g:'tg-r',cat:'SYSTEM'}];

let activeTasks=[{id:'TSK-023',title:'Facebook Ad Campaign',progress:65},{id:'TSK-024',title:'Content Writing',progress:28},{id:'TSK-025',title:'Competitor Analysis',progress:0}];
let knowledgeGaps=['Ad Copywriting Skill','Advanced Audience Research','AI Ad Creative Generator','Dynamic Budget Optimizer','Smart Audience Segmentation'];
let innovations=[{title:'AI-Powered Ad Creative Generator',feasibility:'high'},{title:'Dynamic Budget Optimizer',feasibility:'medium'},{title:'Smart Audience Segmentation',feasibility:'medium'}];
let cycleCount=0, sysHealth=91;
const tabs=['ALL','TASKS','GAPS','INNOVATIONS','SYSTEM'];let cur='ALL';
const agentColors={STRATEGIST:'var(--accent-green)',EXECUTOR:'var(--accent-green)',MENTOR:'var(--accent-orange)',INNOVATOR:'var(--accent-purple)',AMPLIFIER:'var(--accent-green)',REFLECTOR:'var(--accent-pink)',SYSTEM:'var(--accent-pink)',ORCHESTRATOR:'var(--accent-cyan)'};

// ===== AUTO-UPDATE AGENTS =====
function updateAgents(){
    document.getElementById('agent-scroll').innerHTML=agents.map((a,i)=>
        `<div class="agent-card${i===cycleCount%6?' active-card':''}" style="border-left:3px solid ${a.c}">
            <div class="ac-top"><div class="ac-dot ${a.dotClass}"></div><span class="ac-name">${a.n}</span></div>
            <div class="ac-status" style="color:${a.c}">${a.states[a.currentState]}</div>
            <div class="ac-action">${a.actions[a.currentAction]}</div>
        </div>`
    ).join('');
}

function randomizeAgent(){
    const i=Math.floor(Math.random()*6);
    agents[i].currentState=(agents[i].currentState+1)%agents[i].states.length;
    agents[i].currentAction=(agents[i].currentAction+1)%agents[i].actions.length;
    updateAgents();
}

// ===== AUTO-UPDATE FEED =====
function rTabs(){document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="tab${t===cur?' on':''}" onclick="sw('${t}')">${t}${t==='TASKS'?' <span class="badge">'+activeTasks.length+'</span>':t==='GAPS'?' <span class="badge">'+knowledgeGaps.length+'</span>':''}</button>`).join('')}
function sw(t){cur=t;rTabs();rFeed()}
function rFeed(){const f=cur==='ALL'?feedData:feedData.filter(i=>i.cat===cur);document.getElementById('feed').innerHTML=f.map((i,idx)=>`<div class="feed-item${idx===0?' new-item':''}" style="border-left:3px solid ${agentColors[i.a]||'var(--accent-pink)'}"><span class="feed-tm">${i.t}</span><span class="feed-tag ${i.g}">${i.a}</span><span class="feed-msg">${i.m}</span></div>`).join('')}

function addSystemEvent(){
    const events=['Cognitive loop iteration completed','Agent health check passed','Memory index optimized','System metrics updated','Node synchronization done','Pipeline integrity verified'];
    const agentsList=['SYSTEM','AMPLIFIER','REFLECTOR','ORCHESTRATOR'];
    const a=agentsList[Math.floor(Math.random()*4)];
    const now=new Date().toLocaleTimeString('en-US',{hour12:false});
    feedData.unshift({t:now,a:a,m:events[Math.floor(Math.random()*events.length)],g:a==='AMPLIFIER'?'tg-a':a==='REFLECTOR'?'tg-r':'tg-a',cat:'SYSTEM'});
    if(feedData.length>20)feedData.length=20;
    if(cur==='ALL'||cur==='SYSTEM')rFeed();
    cycleCount++;
    document.getElementById('cycle-count').textContent=cycleCount;
}

// ===== AUTO-UPDATE TASKS =====
function updateTaskProgress(){
    activeTasks.forEach(t=>{if(t.progress<100)t.progress=Math.min(100,t.progress+Math.floor(Math.random()*5));});
    activeTasks=activeTasks.filter(t=>t.progress<100);
    renderTasks();
    rTabs();
}

function renderTasks(){document.getElementById('tasks-panel').innerHTML=activeTasks.length?activeTasks.map(t=>`<div class="task-row"><span class="task-id-text">${t.id}</span><span class="task-title-text">${t.title}</span><div class="progress-mini"><div class="progress-fill-mini ${t.progress>50?'prog-high':t.progress>25?'prog-medium':'prog-low'}" style="width:${t.progress}%"></div></div><span class="task-pct-text">${t.progress}%</span></div>`).join(''):'<div style="font-size:8px;color:var(--text-muted);opacity:.7">All tasks completed</div>'}

// ===== PANELS =====
function renderGaps(){document.getElementById('gaps-panel').innerHTML=knowledgeGaps.map(g=>`<div class="gap-row"><span class="gap-icon">⚠</span><span class="gap-text">${g}</span></div>`).join('')}
function renderInnovations(){document.getElementById('innovations-panel').innerHTML=innovations.map(i=>`<div class="innovation-row"><span class="innovation-icon">💡</span><span class="innovation-text">${i.title}</span><span class="feasibility-badge ${i.feasibility==='high'?'feas-high':'feas-medium'}">${i.feasibility.toUpperCase()}</span></div>`).join('')}
function renderMetrics(){sysHealth=Math.max(85,Math.min(99,sysHealth+(Math.random()*2-1)));const eff=Math.floor(sysHealth-2+Math.random()*4);document.getElementById('metrics-panel').innerHTML='<h3>PERFORMANCE METRICS</h3>'+[{l:'Plan Compliance',v:Math.floor(83+Math.random()*5)+'%',t:'up',c:Math.floor(8+Math.random()*8)+'%'},{l:'Tasks Today',v:Math.floor(10+Math.random()*5),t:'up',c:Math.floor(20+Math.random()*12)+'%'},{l:'Task Success Rate',v:Math.floor(90+Math.random()*5)+'%',t:'up',c:Math.floor(5+Math.random()*6)+'%'},{l:'System Efficiency',v:eff+'%',t:eff>90?'up':'down',c:Math.floor(3+Math.random()*8)+'%'}].map(m=>`<div class="stat-row"><span class="stat-l">${m.l}</span><span class="stat-v">${m.v}<span class="trend-${m.t}">${m.t==='up'?'↑':'↓'}${m.c}</span></span></div>`).join('')}
function renderSysStatus(){document.getElementById('sys-panel').innerHTML='<h3>SYSTEM STATUS</h3>'+[{l:'Overall Health',v:Math.floor(sysHealth)+'%'},{l:'Active Agents',v:'6 / 6'},{l:'Queue Length',v:activeTasks.length+' pending'},{l:'Last Cycle',v:new Date().toLocaleTimeString('en-US',{hour12:true})}].map(m=>`<div class="stat-row"><span class="stat-l">${m.l}</span><span class="stat-v">${m.v}</span></div>`).join('')}

// ===== COMMAND =====
function setChip(c){document.getElementById('cmd').value=c;document.getElementById('cmd').focus()}
function showToast(msg,color){const t=document.createElement('div');t.className='toast';t.textContent=msg;if(color)t.style.color=color;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function exec(){const input=document.getElementById('cmd'),btn=document.getElementById('run-btn'),c=input.value.trim();if(!c)return;btn.textContent='...';btn.classList.add('loading');input.disabled=true;const result=simulateCommand(c);const now=new Date().toLocaleTimeString('en-US',{hour12:false});feedData.unshift({t:now,a:result.agent.toUpperCase(),m:result.message,g:result.tagClass,cat:result.category});if(cur==='ALL'||cur===result.category)rFeed();updateAll();showToast('✅ '+result.message,'var(--accent-green)');input.value='';input.disabled=false;btn.textContent='RUN';btn.classList.remove('loading');input.focus()}
function simulateCommand(cmd){const c=cmd.toLowerCase().trim();let r={};if(c.includes('plan')){const tid='TSK-'+String(activeTasks.length+26).padStart(3,'0');activeTasks.push({id:tid,title:cmd,progress:0});r={agent:'strategist',tagClass:'tg-s',category:'TASKS',message:`Plan: "${cmd}" → ${tid}`}}else if(c.includes('loop')||c.includes('cycle')){cycleCount++;document.getElementById('cycle-count').textContent=cycleCount;r={agent:'orchestrator',tagClass:'tg-a',category:'SYSTEM',message:'Cognitive loop completed'} }else if(c.includes('analyze')){const g=cmd.replace(/analyze\s*/i,'')||'System';knowledgeGaps.push(g);r={agent:'mentor',tagClass:'tg-m',category:'GAPS',message:`Analysis done. Gap: "${g}"`}}else if(c.includes('fix')||c.includes('gap')){if(knowledgeGaps.length){const res=knowledgeGaps.pop();r={agent:'mentor',tagClass:'tg-m',category:'GAPS',message:`Gap resolved: "${res}"`}}else{r={agent:'mentor',tagClass:'tg-m',category:'GAPS',message:'No gaps. System nominal.'}}}else if(c.includes('innov')||c.includes('idea')){const idea=cmd.replace(/(generate|create)\s*/i,'')||'Innovation';innovations.push({title:idea,feasibility:'medium'});r={agent:'innovator',tagClass:'tg-i',category:'INNOVATIONS',message:`Innovation: "${idea}"`}}else if(c.includes('exec')||c.includes('task')){if(activeTasks.length){const t=activeTasks[0];t.progress=Math.min(100,t.progress+25);r={agent:'executor',tagClass:'tg-e',category:'TASKS',message:`Executing ${t.id}: ${t.title} (${t.progress}%)`};if(t.progress>=100)activeTasks.shift()}else{r={agent:'executor',tagClass:'tg-e',category:'TASKS',message:'No tasks in queue'}}}else{r={agent:'system',tagClass:'tg-r',category:'SYSTEM',message:`Command: "${cmd}"`}}return r}
function updateAll(){renderTasks();renderGaps();renderInnovations();renderMetrics();renderSysStatus();rTabs()}

// ===== CLOCK =====
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-US',{hour12:false})}

// ===== INIT =====
function initAll(){updateAgents();rTabs();rFeed();renderTasks();renderGaps();renderInnovations();renderMetrics();renderSysStatus();updateClock()}
initAll();

// ===== LIVE INTERVALS =====
setInterval(randomizeAgent,3000);
setInterval(addSystemEvent,5000);
setInterval(updateTaskProgress,4000);
setInterval(renderMetrics,6000);
setInterval(renderSysStatus,6000);
setInterval(updateClock,1000);

// Pulse system dot
setInterval(()=>{const d=document.getElementById('live-dot');d.style.opacity=d.style.opacity==='0.3'?'1':'0.3'},800);

setTimeout(()=>document.getElementById('cmd').focus(),500);
</script>
