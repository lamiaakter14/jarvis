
[project]
name = "jarvis"
version = "1.0.0"
description = "JARVIS: A Learning Operating System for Human Intelligence Amplification"
authors = [{name = "Your Name", email = "youremail@example.com"}]
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "openai",
    "langchain",
    "python-decouple",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "requests",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "tqdm",
    "numpy",
    "scikit-learn",
    "pandas",
    "pyyaml",
    "flask",
    "markdown",
    "dependency-injector>=4.41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "flake8",
    "black",
    "mypy",
    "isort",
]

[project.scripts]
jarvis-api = "jarvis_api.main:main"
jarvis-cli = "jarvis_cli.main:app"

[tool.setuptools.packages.find]
where = ["packages", "apps"]
include = ["jarvis_core*", "jarvis_api*", "jarvis_cli*"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.mypy]
files = ["packages", "apps", "tests"]