apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jarvis-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/websocket-services: jarvis-api
spec:
  tls:
  - hosts:
    - jarvis.example.com
    secretName: jarvis-tls
  rules:
  - host: jarvis.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: jarvis-api
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jarvis-web
            port:
              number: 80
