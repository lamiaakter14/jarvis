apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-web
  labels:
    app: jarvis-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jarvis-web
  template:
    metadata:
      labels:
        app: jarvis-web
    spec:
      containers:
      - name: web
        image: jarvis-web:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-web
spec:
  selector:
    app: jarvis-web
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
