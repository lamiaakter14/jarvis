version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis_api
    command: python -m jarvis_api.main
    ports:
      - "8000:8000"
    volumes:
      - ./runtime:/app/runtime
      - ./memory:/app/memory
      - ./packages:/app/packages
      - ./apps:/app/apps
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/packages:/app/apps
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - MEMORY_BASE_PATH=/app/memory
      - RUNTIME_BASE_PATH=/app/runtime
    depends_on:
      - postgres
      - redis
    networks:
      - jarvis_network
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: jarvis_web
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - jarvis_network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: jarvis_postgres
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - jarvis_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jarvis_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jarvis_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  jarvis_network:
    driver: bridge
