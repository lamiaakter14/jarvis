version: '3.8'

services:
  jarvis-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-api
    ports:
      - "8000:8000"
    volumes:
      - ./memory:/app/memory
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - ENV_FILE=./.env
    restart: unless-stopped
    command: python src/presentation/api/main.py
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  jarvis-cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-cli
    volumes:
      - ./memory:/app/memory
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - ENV_FILE=./.env
    profiles:
      - cli
    command: python src/presentation/cli/main.py run
