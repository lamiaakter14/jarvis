name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
      - uses: actions/checkout@v4
            - name: Detect web changes
        id: web_changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'compose.yml'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pre-commit
            .pytest_cache
            .mypy_cache
          key: ${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt', '**/pyproject.toml', '**/.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-
            ${{ runner.os }}-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run linting
        run: |
          ruff check . --exit-zero
          black --check . || true
          isort --check-only . || true
      
      - name: Run type checking
        run: |
          mypy packages/jarvis_core --ignore-missing-imports --no-strict-optional || true
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=packages/jarvis_core --cov-report=xml --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Verify Docker and Compose
        run: |
          docker --version
          docker compose version

            - name: Build Docker images (api only)
        if: steps.web_changes.outputs.web != 'true'
        env:
          POSTGRES_PASSWORD: ci-password
        run: |
          docker compose build api

      - name: Build Docker images (full, includes web)
        if: steps.web_changes.outputs.web == 'true'
        env:
          POSTGRES_PASSWORD: ci-password
        run: |
          docker compose build
      
            - name: Test Docker Compose (api only)
        if: steps.web_changes.outputs.web != 'true'
        env:
          POSTGRES_PASSWORD: ci-password
        run: |
          docker compose up -d api
          sleep 10
          docker compose ps
          docker compose down

      - name: Test Docker Compose (full, includes web)
        if: steps.web_changes.outputs.web == 'true'
        env:
          POSTGRES_PASSWORD: ci-password
        run: |
          docker compose up -d
          sleep 10
          docker compose ps
          docker compose down
