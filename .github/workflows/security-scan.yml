name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly scan

jobs:
  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Bandit
        run: pip install bandit[toml]
      
      - name: Run Bandit scan
        run: |
          bandit -r packages/ apps/ -f json -o bandit-report.json || true
          # TODO: re-enable strict mode after resolving remaining B104 (hardcoded_bind_all_interfaces)
          # findings in apps/api/jarvis_api/main.py, apps/api/jarvis_api/src/config/settings.py,
          # and packages/jarvis_core/infrastructure/config/settings.py (host="0.0.0.0").
          # B110/B112 findings have been resolved.
          bandit -r packages/ apps/ -f screen || true

  safety:
    name: Safety Dependency Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Safety
        run: pip install safety
      
      - name: Check dependencies
        run: |
          pip install -e .
          pip freeze > requirements.txt
          safety check --json || true

  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
